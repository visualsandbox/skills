name: Test

# The plugin manifests and the skill frontmatter both fail quietly: a bad
# manifest does not install, a bad description never routes, and neither
# raises anything. These checks read files on disk — no network, no key,
# nothing that costs money.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test
